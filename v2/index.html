<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c9e4ff">
  <title>CoinToss-in.web</title>

</head>
<body>

  <main>
    <h1>Coin Toss Game</h1>
    <p class="hint">Click the button or press <kbd>T</kbd> — call it in the air!</p>

    <div class="stage">
      <div class="coin-container" id="coinContainer">
        <div id="coin" class="coin">
          <div class="side front">Heads</div>
          <div class="side back">Tails</div>
          <div class="coin-edge"></div>
        </div>
      </div>
      <div class="ground-shadow" id="coinShadow"></div>
    </div>

    <button id="tossBtn" type="button">Toss The Coin</button>
    <div id="result" role="status" aria-live="polite"></div>

    <div class="scoreboard">
      <div class="chip"><b id="headsCount">0</b><small>Heads</small></div>
      <div class="chip"><b id="tailsCount">0</b><small>Tails</small></div>
      <div class="chip"><b id="totalCount">0</b><small>Total</small></div>
      <button class="reset-btn" id="resetBtn" type="button">Reset</button>
    </div>
  </main>

  <footer>Developed by <strong>Toha</strong></footer>

    <link rel="stylesheet" href="main.css">
    <script src="script.js"></script>

</body>
</html>
